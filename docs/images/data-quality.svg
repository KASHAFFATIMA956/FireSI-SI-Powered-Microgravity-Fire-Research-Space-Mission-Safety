<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101d34"/></linearGradient><linearGradient id="panel"><stop stop-color="#132640"/><stop offset="1" stop-color="#0d1d31"/></linearGradient><linearGradient id="accent"><stop stop-color="#43d5d0"/><stop offset="1" stop-color="#6a9cff"/></linearGradient></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="270" height="900" fill="#09172a"/><circle cx="42" cy="48" r="19" fill="url(#accent)"/><text x="75" y="55" fill="#f2f7ff" font-family="Arial" font-size="23" font-weight="700">FIRELINE <tspan fill="#53d7d0">SI</tspan></text><text x="28" y="83" fill="#6e8aa9" font-family="Arial" font-size="10">COSMIC ASTRONOVA</text><rect x="20" y="130" width="230" height="42" rx="9" fill="#17334c"/><text x="48" y="157" fill="#b8c9dc" font-family="Arial" font-size="14">Mission overview</text><rect x="20" y="184" width="230" height="42" rx="9" fill="transparent"/><text x="48" y="211" fill="#b8c9dc" font-family="Arial" font-size="14">Investigation explorer</text><rect x="20" y="238" width="230" height="42" rx="9" fill="transparent"/><text x="48" y="265" fill="#b8c9dc" font-family="Arial" font-size="14">Risk intelligence</text><rect x="20" y="292" width="230" height="42" rx="9" fill="transparent"/><text x="48" y="319" fill="#b8c9dc" font-family="Arial" font-size="14">Data quality</text><rect x="20" y="346" width="230" height="42" rx="9" fill="transparent"/><text x="48" y="373" fill="#b8c9dc" font-family="Arial" font-size="14">SI analyst</text><rect x="20" y="400" width="230" height="42" rx="9" fill="transparent"/><text x="48" y="427" fill="#b8c9dc" font-family="Arial" font-size="14">NASA media &amp; resources</text><rect x="20" y="454" width="230" height="42" rx="9" fill="transparent"/><text x="48" y="481" fill="#b8c9dc" font-family="Arial" font-size="14">Moon &amp; Mars safety</text><text x="310" y="52" fill="#6f8aa8" font-family="Arial" font-size="12">COSMIC ASTRONOVA / RESEARCH CONSOLE</text><text x="310" y="112" fill="#f4f8ff" font-family="Arial" font-size="36" font-weight="700">Data Quality</text><text x="310" y="146" fill="#94abc3" font-family="Arial" font-size="16">Surface unusual values and duplicate records before interpreting the science.</text><rect x="310" y="190" width="1080" height="600" rx="15" fill="url(#panel)" stroke="#29415d"/><text x="332" y="224" fill="#edf5ff" font-family="Arial" font-size="18" font-weight="700">Data quality audit · flags for source verification</text><rect x="340" y="260" width="470" height="180" rx="13" fill="#10243b" stroke="#314c68"/><text x="362" y="315" fill="#f2b95f" font-family="Arial" font-size="34" font-weight="700">2,293</text><text x="362" y="350" fill="#edf5ff" font-family="Arial" font-size="17" font-weight="700">Exact duplicate rows</text><text x="362" y="382" fill="#9bb1c8" font-family="Arial" font-size="12">Confirm repeated runs versus duplicated exports.</text><rect x="850" y="260" width="470" height="180" rx="13" fill="#10243b" stroke="#314c68"/><text x="872" y="315" fill="#ff8b78" font-family="Arial" font-size="34" font-weight="700">2</text><text x="872" y="350" fill="#edf5ff" font-family="Arial" font-size="17" font-weight="700">Oxygen values > 100</text><text x="872" y="382" fill="#9bb1c8" font-family="Arial" font-size="12">PSI-20 values 2,100 and 3,400 need unit/encoding review.</text><rect x="340" y="490" width="470" height="180" rx="13" fill="#10243b" stroke="#314c68"/><text x="362" y="545" fill="#ff8b78" font-family="Arial" font-size="34" font-weight="700">170</text><text x="362" y="580" fill="#edf5ff" font-family="Arial" font-size="17" font-weight="700">Pressure values > 100 psi</text><text x="362" y="612" fill="#9bb1c8" font-family="Arial" font-size="12">Verify units and experimental context.</text><rect x="850" y="490" width="470" height="180" rx="13" fill="#10243b" stroke="#314c68"/><text x="872" y="545" fill="#65cbd2" font-family="Arial" font-size="34" font-weight="700">2,589</text><text x="872" y="580" fill="#edf5ff" font-family="Arial" font-size="17" font-weight="700">Zero-flow entries</text><text x="872" y="612" fill="#9bb1c8" font-family="Arial" font-size="12">Confirm measured zero versus missing-value convention.</text><text x="345" y="735" fill="#f0c77c" font-family="Arial" font-size="14">Review flags do not automatically modify the source data.</text><text x="310" y="865" fill="#6e849e" font-family="Arial" font-size="11">FIRELINE SI · RESEARCH EXPLORATION INTERFACE · NOT OPERATIONAL SAFETY GUIDANCE</text></svg>